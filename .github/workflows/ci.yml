name: CI

# The relay conformance leg reads the shared specification corpus, so the spec
# repository is checked out as a sibling at ../wire-format-fixtures — the same
# path every conformant host in the family resolves it at, and the same path
# `run.ps1` expects locally.
#
# The corpus is deliberately UNPINNED. It is the shared gate every host
# certifies against, and the point of giving it one home is that all hosts see
# the same current specification; pinning it would reintroduce the drift that
# single home exists to remove.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the tree (its own and the corpus
# sibling) — it publishes nothing and comments nowhere. Stated explicitly so the
# job never inherits a write-scoped default token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-devtools
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-devtools

      - uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--frozen-lockfile` is the point of committing a lockfile: without it pnpm
      # silently RESOLVES a drifted manifest and installs a dependency set no one
      # reviewed, so CI certifies a tree the maintainer never built. With it, a
      # manifest/lockfile disagreement fails HERE, by name, and the fix is to commit
      # the regenerated lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
